<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Street Racer</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#101820;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center}
main{width:min(100%,420px)}.hud{display:flex;justify-content:space-between;gap:8px;font-weight:bold;margin:8px 0 12px}
.game{position:relative;overflow:hidden;border-radius:14px;background:#222}
canvas{display:block;width:100%;height:auto;touch-action:none}
.cover{position:absolute;inset:0;background:#000b;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
button{border:0;border-radius:12px;padding:13px 20px;background:#2478ed;color:white;font-size:16px;font-weight:bold;cursor:pointer}
.controls{display:flex;justify-content:center;gap:20px;margin:14px}
.controls button{min-width:100px;font-size:24px;background:#26384c}
#status{text-align:center;color:#cbd5e1;font-size:14px}
</style>
</head>
<body>
<main>
<h2>🏁 STREET RACER</h2>
<div class="hud"><span id="score">Score: 0</span><span id="speed">Speed: 0</span></div>
<div class="game">
<canvas id="track" width="360" height="540"></canvas>
<div class="cover" id="cover">
<div style="font-size:48px">🏎️</div><h1>STREET RACER</h1>
<p>Dodge traffic. Survive as long as you can!</p>
<button id="start">START RACE</button>
</div>
</div>
<div class="controls"><button id="left">◀</button><button id="right">▶</button></div>
<p id="status">Use arrow keys or buttons to steer. Avoid the other cars!</p>
</main>
<script>
const canvas=document.getElementById('track'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),speedEl=document.getElementById('speed');
const cover=document.getElementById('cover'),status=document.getElementById('status');
const W=360,H=540,lanes=[115,180,245];
let player={x:180,y:445},traffic=[],score=0,speed=3,offset=0,running=false,spawn=0,last=0,keys={};
function car(x,y,color){
 ctx.fillStyle='#111';ctx.fillRect(x-18,y+8,36,45);
 ctx.fillStyle=color;ctx.fillRect(x-15,y,30,52);
 ctx.fillStyle='#bdeaff';ctx.fillRect(x-11,y+8,22,12);
 ctx.fillStyle='#18232c';ctx.fillRect(x-11,y+32,22,10);
 ctx.fillStyle='#fff6b0';ctx.fillRect(x-12,y+2,7,4);ctx.fillRect(x+5,y+2,7,4);
 ctx.fillStyle='#222';ctx.fillRect(x-18,y+10,4,12);ctx.fillRect(x+14,y+10,4,12);
}
function draw(){
 ctx.fillStyle='#39834a';ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#444';ctx.fillRect(55,0,250,H);
 ctx.fillStyle='#eee';ctx.fillRect(55,0,5,H);ctx.fillRect(300,0,5,H);
 ctx.fillStyle='#e6d88c';
 for(let y=-40+(offset%70);y<H;y+=70){ctx.fillRect(135,y,4,38);ctx.fillRect(220,y,4,38)}
 traffic.forEach(c=>car(c.x,c.y,c.color));car(player.x,player.y,'#e33');
}
function reset(){
 running=false;player.x=180;traffic=[];score=0;speed=3;offset=0;spawn=0;
 scoreEl.textContent='Score: 0';speedEl.textContent='Speed: 0';
 cover.style.display='flex';cover.innerHTML='<div style="font-size:48px">🏎️</div><h1>STREET RACER</h1><p>Dodge traffic. Survive as long as you can!</p><button id="start">START RACE</button>';
 document.getElementById('start').onclick=start;status.textContent='Ready to race?';draw();
}
function end(){
 running=false;cover.style.display='flex';
 cover.innerHTML='<div style="font-size:48px">💥</div><h1>RACE OVER</h1><p>Your score: '+score+'</p><button id="again">RACE AGAIN</button>';
 document.getElementById('again').onclick=start;status.textContent='You crashed! Try again.';
}
function start(){
 if(running)return;player.x=180;traffic=[];score=0;speed=3;offset=0;spawn=0;running=true;
 cover.style.display='none';status.textContent='Race in progress!';last=performance.now();requestAnimationFrame(loop);
}
function loop(t){
 if(!running)return;const dt=Math.min((t-last)/16.67,2);last=t;
 speed=Math.min(8,3+score/180);
 if(keys.left)player.x-=4.5*dt;if(keys.right)player.x+=4.5*dt;
 player.x=Math.max(78,Math.min(282,player.x));offset+=speed*dt;spawn+=dt;
 if(spawn>Math.max(25,65-score/15)){spawn=0;traffic.push({x:lanes[Math.floor(Math.random()*3)],y:-65,color:['#2980d9','#f2a900','#9b59b6','#ddd'][Math.floor(Math.random()*4)]});}
 traffic.forEach(c=>c.y+=speed*dt);traffic=traffic.filter(c=>c.y<H+70);
 for(const c of traffic){if(Math.abs(c.x-player.x)<28&&Math.abs(c.y-player.y)<48){draw();end();return;}}
 score+=Math.max(1,Math.floor(speed*dt));scoreEl.textContent='Score: '+score;speedEl.textContent='Speed: '+speed.toFixed(1);
 draw();requestAnimationFrame(loop);
}
function hold(id,key){
 const b=document.getElementById(id),down=e=>{e.preventDefault();keys[key]=true},up=e=>{e.preventDefault();keys[key]=false};
 b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up);
}
hold('left','left');hold('right','right');
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true;});
window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false;});
document.getElementById('start').onclick=start;draw();
</script>
</body>
</html>
